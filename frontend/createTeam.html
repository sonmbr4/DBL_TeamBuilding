<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frontend sencillo para mostrar cards con personajes de Dragon Ball Legends">
    <title>DB Legends Team Builder</title>
    <link rel="stylesheet" href="/assets/Css/styles.css">
    <link rel="stylesheet" href="/assets/Css/anotherStyle.css">
</head>

<body>
    <main class="page-shell">
        <!--Hero Header-->
        <section class="hero">
            <div>
                <p class="eyebrow">DBL Teams</p>
                <h1>Create your team</h1>
                <p class="lead">
                    Select up to 6 characters to form your team.
                </p>
            </div>

            <div class="hero-meta">
                <span class="meta-pill">Team: <strong>0/6</strong></span>
            </div>
        </section>

        <!--Contenedor principal-->
        <div class="main-layout">
            <!--Lista de personajes-->
            <section class="characters-section">
                <div class="toolbar" arial-label="Resumen de personajes">
                    <div>
                        <h2 id="statusText"></h2>
                    </div>
                    <div class="toolbar-actions">
                        <input type="search" id="characterSearchInput" class="character-search-input"
                            placeholder="Search names..." aria-label="Search characters by name">
                        <select id="characterColorFilter" class="character-color-select"
                            aria-label="Filtrar personajes por color">
                            <option value="ALL">All Colors</option>
                            <option value="RED">RED</option>
                            <option value="BLU">BLU</option>
                            <option value="YEL">YEL</option>
                            <option value="PUR">PUR</option>
                            <option value="GRN">GRN</option>
                            <option value="LGT">LGT</option>
                            <option value="DRK">DRK</option>
                        </select>

                        <select id="characterTagFilter" class="character-color-select" aria-label="Filtrar personajes por etiqueta">
                            <option value="ALL">All Tags</option>
                            <option value="Saiyan">Saiyan</option>
                            <option value="Hybrid Saiyan">Hybrid Saiyan</option>
                            <option value="Super Saiyan">Super Saiyan</option>
                            <option value="Super Saiyan 2">Super Saiyan 2</option>
                            <option value="Super Saiyan 3">Super Saiyan 3</option>
                            <option value="Super Saiyan 4">Super Saiyan 4</option>
                            <option value="Super Saiyan God">Super Saiyan God</option>
                            <option value="Super Saiyan God SS">Super Saiyan God SS</option>
                            <option value="Super Saiyan Rosé">Super Saiyan Rosé</option>
                            <option value="Namekian">Namekian</option>
                            <option value="Android">Android</option>
                            <option value="Shadow Dragon">Shadow Dragon</option>
                            <option value="God of Destruction">God of Destruction</option>
                            <option value="Angel">Angel</option>
                            <option value="Kids">Kids</option>
                            <option value="Girls">Girls</option>
                            <option value="Regeneration">Regeneration</option>
                            <option value="Powerful Opponent">Powerful Opponent</option>
                            <option value="Transforming Warrior">Transforming Warrior</option>
                            <option value="Lineage of Evil">Lineage of Evil</option>
                            <option value="Otherworld Warrior">Otherworld Warrior</option>
                            <option value="Fusion Warrior">Fusion Warrior</option>
                            <option value="God Ki">God Ki</option>
                            <option value="Son Family">Son Family</option>
                            <option value="Vegeta Clan">Vegeta Clan</option>
                            <option value="Super Warrior">Super Warrior</option>
                            <option value="Frieza Force">Frieza Force</option>
                            <option value="Ginyu Force">Ginyu Force</option>
                            <option value="Team Bardock">Team Bardock</option>
                            <option value="Hera Clan">Hera Clan</option>
                            <option value="Turles Crusher Corps">Turles Crusher Corps</option>
                            <option value="Future">Future</option>
                            <option value="GT">GT</option>
                            <option value="DAIMA">DAIMA</option>
                            <option value="Merging">Merging</option>
                            <option value="Absorption">Absorption</option>
                            <option value="Fusion">Fusion</option>
                            <option value="Potara">Potara</option>
                            <option value="Weapon Wielder">Weapon Wielder</option>
                            <option value="Rival Universe">Rival Universe</option>
                            <option value="Universe 2">Universe 2</option>
                            <option value="Universe 4">Universe 4</option>
                            <option value="Universe 6">Universe 6</option>
                            <option value="Universe 9">Universe 9</option>
                            <option value="Universe 11">Universe 11</option>
                            <option value="Universe Rep">Universe Rep</option>
                            <option value="DB">DB</option>
                            <option value="Event Exclusive">Event Exclusive</option>
                            <option value="Legends Road">Legends Road</option>
                        </select>

                        <select id="characterRarityFilter" class="character-color-select">
                            <option value="ALL">All Rarities</option>
                            <option value="LEGEND">LEGEND</option>
                            <option value="ULTRA">ULTRA</option>
                            <option value="SPARKING">SPARKING</option>
                            <option value="EXTREME">EXTREME</option>
                            <option value="HERO">HERO</option>
                        </select>
                    </div>
                </div>

                <div class="characters-grid" id="charactersGrid" aria-live="polite"></div>
            </section>

            <!-- columna del team-->
             
            <aside class="team-section">
                <div class="team-panel">
                    <div class="team-header">
                        <h2>Your Team</h2>
                        <span class="team-slots-counter" id="teamSlotsCounter">0 / 6</span>
                    </div>

                    <!-- Slots del equipo -->
                    <div class="team-slots" id="teamSlots">
                        <!-- Se generan dinamicamente -->
                    </div>

                    <!-- Acciones del equipo -->
                    <div class="team-actions">
                        <input type="text" id="teamNameInput" class="team-name-input"
                            placeholder="Team name...">

                        <button id="saveTeamBtn" class="btn-save" disabled>
                            Save Team
                        </button>

                        <button id="clearTeamBtn" class="btn-clear">
                            Clear Team
                        </button>

                        <a href="/equipos" class="btn-small btn-load">View Saved Teams</a>
                    </div>
                    <div class="team-stats-power">
                        <p class="stats-label">LP: <span id="teamPower" class="stats-value">0</span> </p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script src="/assets/Js/equipmentModal.js"></script>
    <script src="/assets/Js/teamManager.js"></script>
    <script src="/assets/Js/zAbilityParser.js"></script>
    <script src="/assets/Js/app.js"></script>
</body>

</html>
