<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Detail | DB Legends Team Builder</title>
    <link rel="stylesheet" href="/assets/Css/anotherStyle.css">
    <link rel="stylesheet" href="/assets/Css/teamDetail.css">
    <style>
        /* Ajustes rápidos para la página de detalle */
        .detail-container {
            width: min(1000px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 32px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="detail-container">
        <a href="/equipos" class="back-link">← Return to the equipment list</a>
        
        <section id="teamDetailSection">
            <div class="loading-text">Loading team...</div>
        </section>
    </main>

    <script src="/assets/Js/teamManager.js"></script>
    <script src="/assets/Js/teamDetail.js"></script>
</body>
</html>
