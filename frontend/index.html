<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de equipos guardados de Dragon Ball Legends">
    <title>Equipos guardados | DB Legends Team Builder</title>
    <link rel="stylesheet" href="/assets/Css/styles.css">
    <link rel="stylesheet" href="/assets/Css/anotherStyle.css">
</head>

<body>
    <main class="saved-page-shell" style="width: min(1180px, calc(100% - 24px)); margin: 0 auto; padding: 20px 0 32px;">
        <section class="hero">
            <div>
                <p class="eyebrow">DBL Teams</p>
                <h1>Equipos guardados</h1>
                <p class="lead">Revisa, actualiza o elimina los equipos que ya guardaste desde el builder.</p>
            </div>

            <div class="saved-page-actions">
                <a href="/builder" class="btn-small btn-load btn-back">Crear equipo</a>
                <button id="refreshSavedTeamsBtn" class="btn-refresh" type="button">Actualizar lista</button>
            </div>
        </section>

        <section class="saved-teams-section" style="margin-top: 16px;">
            <div class="saved-teams-header">
                <div>
                    <h2 style="margin: 0;">Listado de equipos</h2>
                    <p id="savedTeamsStatus" class="lead" style="margin-top: 8px;">Cargando equipos guardados...</p>
                </div>
                <span class="meta-pill" id="savedTeamsCount">0 equipos</span>
            </div>

            <!--Filtrar-->
            <div class="saved-teams-filters">
                <input
                    type="search"
                    id="teamSearchInput"
                    class="team-search-input"
                    placeholder="Nombre del equipo. . ."
                    autocomplete="off"
                >
                <select id="teamColorFilter" class="team-color-select">
                    <option value="">Todos los colores</option>
                    <option value="RED">RED</option>
                    <option value="BLU">BLU</option>
                    <option value="YEL">YEL</option>
                    <option value="PUR">PUR</option>
                    <option value="GRN">GRN</option>
                    <option value="LGT">LGT</option>
                </select>
            </div>






            <div id="savedTeamsList" class="saved-teams-list">
                <div class="loading-text">Cargando equipos...</div>
            </div>
        </section>
    </main>

    <script src="/assets/Js/teamManager.js"></script>
</body>

</html>
